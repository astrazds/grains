name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - name: Toolchain files match
        shell: bash
        run: |
          mise_rust=$(sed -n 's/^rust *= *"\(.*\)"/\1/p' mise.toml)
          toolchain_rust=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ "$mise_rust" != "$toolchain_rust" ]; then
            echo "mise.toml has ${mise_rust} and rust-toolchain.toml has ${toolchain_rust}"
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Wasm
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --target wasm32-unknown-unknown --lib --locked -- -D warnings
          cargo build --lib --locked --target wasm32-unknown-unknown
