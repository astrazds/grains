name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux is pinned to lavapipe below. Windows keeps the software-flagged
    # WARP adapter that DXGI already exposes, so this job does not install one.
    env:
      GRAINS_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)
          if [ -z "$icd" ]; then
            echo "lavapipe ICD missing"
            find /usr -name 'lvp_icd*.json' -o -name '*icd*.json' | head
            exit 1
          fi
          echo "Using lavapipe ICD $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          mise_rust=$(sed -n 's/^rust *= *"\(.*\)"/\1/p' mise.toml)
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ "$mise_rust" != "$channel" ] || [ -z "$channel" ]; then
            echo "mise.toml has ${mise_rust} and rust-toolchain.toml has ${channel}"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked -- --nocapture
      - run: cargo build --locked
      - name: Wasm
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --target wasm32-unknown-unknown --lib --locked -- -D warnings
          cargo build --lib --locked --target wasm32-unknown-unknown
